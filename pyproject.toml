[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecraft-cli"
version = "0.1.0"
description = "CLI to assemble multi-language apps from prewritten snippets"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
dependencies = [
  "click>=8.0.0"
]

[project.scripts]
codecraft = "codecraft.cli:main"
